id: immersive-sales-room
name: immersive-sales-room
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: false
connectors:
  - name: verkoop
    type: fabric-semanticmodel
    config:
      # Replace with your own Fabric workspace ID and semantic model ID (see README, "Connect your own semantic model")
      workspaceId: 00000000-0000-0000-0000-000000000000
      itemId: 00000000-0000-0000-0000-000000000000
    auth:
      type: delegated
    version: "1"
    operations:
      - name: executeQuery
